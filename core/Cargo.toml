[package]
name = "facetra-pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["bundled-duckdb"]
# Disable only for the macOS common-native-engine validation control.
bundled-duckdb = ["duckdb/bundled", "duckdb/json"]

[dependencies]
facetra-contract = { path = "../contract" }
duckdb = { version = "=1.4.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
serde_yaml_ng = "=0.10.0"
tempfile = "3"
libc = "0.2"
git2 = { version = "=0.21.0", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["stream", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
futures-util = "0.3"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql_async = { version = "=0.36.1", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
rusqlite = { version = "=0.32.1", features = ["bundled", "backup", "hooks", "column_decltype"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
url = "2"
uuid = "1"
scraper = { version = "=0.24.0", default-features = false }
sxd-document = "=0.3.2"
sxd-xpath = "=0.4.2"

# rustls-native-certs treats iOS as Unix and cannot read Apple's trust store.
# Use Security.framework through native-tls on Apple platforms.
[target.'cfg(target_vendor = "apple")'.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["native-tls"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }

