params:
  - { name: symbol, label: 股票代码, type: string, default: "600519.SH", options: ["600519.SH", "300750.SZ", "000001.SZ"] }
  - { name: days, label: 交易日数, type: integer, default: 60, minimum: 1, maximum: 180, options: [30, 60, 120, 180] }
  - { name: ma_window, label: 均线窗口, type: integer, default: 20, minimum: 2, maximum: 60, advanced: true }
sources:
  prices:
    source: duckdb
    file: data/example/stock-daily.csv
  symbols:
    source: duckdb
    file: data/example/symbols.csv
dataset:
  id: prices
  sources:
    - { id: prices, ref: "#/sources/prices" }
    - { id: symbols, ref: "#/sources/symbols" }
  sql: |
    WITH history AS (
      SELECT p.symbol, s.name AS symbol_name, CAST(p.trade_date AS DATE) AS trade_date,
        CAST(p.close AS DOUBLE) AS close,
        CASE WHEN COUNT(*) OVER w >= $ma_window THEN
          AVG(CAST(p.close AS DOUBLE)) OVER w END AS ma
      FROM prices p LEFT JOIN symbols s ON p.symbol = s.symbol
      WHERE p.symbol = $symbol
      WINDOW w AS (ORDER BY p.trade_date ROWS BETWEEN ($ma_window - 1) PRECEDING AND CURRENT ROW)
    ), recent AS (
      SELECT * FROM history ORDER BY trade_date DESC LIMIT $days
    )
    SELECT * FROM recent ORDER BY trade_date
metadata:
  id: example_price
  title: 股价与均线
  notes: 虚构行情，CSV 由 DuckDB 读取；业务计算在 Dataset SQL 中完成。
chart:
  dataset: prices
  renderer: echarts
  option:
    tooltip: {trigger: axis}
    grid: {left: 12, right: 18, top: 24, bottom: 24, containLabel: true}
    xAxis: {type: category, data: {from: prices, field: trade_date}}
    yAxis: {type: value, scale: true}
    series:
      - {type: line, name: close, data: {from: prices, field: close}, showSymbol: false}
      - {type: line, name: ma, data: {from: prices, field: ma}, showSymbol: false, lineStyle: {type: dashed}}
