{
  "metadata": {
    "id": "options_consumer",
    "title": "Native chart"
  },
  "sources": {
    "input": {
      "source": "duckdb",
      "file": "data/input.csv"
    }
  },
  "dataset": {
    "id": "data",
    "sources": [
      {
        "id": "input",
        "ref": "#/sources/input"
      }
    ]
  },
  "chart": {
    "dataset": "data",
    "renderer": "echarts",
    "option": {
      "series": [
        {
          "type": "line",
          "data": {
            "from": "data",
            "field": "value"
          }
        }
      ]
    }
  },
  "params": [
    {
      "name": "choice",
      "type": "string",
      "options": {
        "ref": "options_provider.yaml#/sources/input"
      }
    }
  ]
}
