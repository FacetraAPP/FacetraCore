{
  "metadata": {
    "id": "native",
    "title": "Native chart"
  },
  "sources": {
    "input": {
      "source": "duckdb",
      "file": "data/input.csv",
      "token": "private-credential"
    }
  },
  "dataset": {
    "id": "data",
    "sources": [
      {
        "id": "input",
        "ref": "#/sources/input"
      }
    ]
  },
  "chart": {
    "dataset": "data",
    "renderer": "echarts",
    "option": {
      "series": [
        {
          "type": "line",
          "data": {
            "from": "data",
            "field": "value"
          }
        }
      ]
    }
  }
}
