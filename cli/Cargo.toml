[package]
name = "facetra-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Render Facetra chart YAML without the Mac app"
license.workspace = true
repository.workspace = true

[[bin]]
name = "facetra-render"
path = "src/main.rs"

[dependencies]
facetra-contract = { path = "../contract" }
facetra-pipeline = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
