name: Apple artifacts

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/apple-artifacts.yml"
      - "Tools/build-apple-artifacts.sh"

permissions:
  contents: read

concurrency:
  group: apple-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: source
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: apple-artifacts
          key: ${{ matrix.target }}
          cache-on-failure: true
          cache-bin: false
          save-if: "${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}"
      - name: Build Apple slice
        env:
          FACETRA_APPLE_TARGETS: ${{ matrix.target }}
          FACETRA_APPLE_BUILD_ONLY: "1"
        run: Tools/build-apple-artifacts.sh
      - name: Upload Apple slice
        uses: actions/upload-artifact@v4
        with:
          name: FacetraPipeline-${{ matrix.target }}
          path: build/apple/libfacetra_pipeline-${{ matrix.target }}.a
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [source, build]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 1
      - name: Download Apple slices
        uses: actions/download-artifact@v4
        with:
          pattern: FacetraPipeline-*
          path: build/apple/slices
          merge-multiple: true
      - name: Package Apple artifacts
        env:
          COMMIT_SHA: ${{ needs.source.outputs.sha }}
          FACETRA_APPLE_SLICES_DIR: ${{ github.workspace }}/build/apple/slices
        run: Tools/build-apple-artifacts.sh
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FacetraCore-apple-${{ needs.source.outputs.sha }}
          path: |
            build/apple/FacetraPipeline.xcframework.zip
            build/apple/FacetraCoreSupport.zip
            build/apple/FacetraCore-main.json
            build/apple/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [source, package]
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FacetraCore-apple-${{ needs.source.outputs.sha }}
          path: build/apple
      - name: Verify and publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.source.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd build/apple
          sha256sum -c SHA256SUMS
          cat > release-notes.md <<EOF
          Automatic build of the main branch.

          - Commit: $COMMIT_SHA
          - Workflow run: $RUN_URL
          - Rust toolchain: 1.90.0
          - Deployment floors: macOS 14 / iOS 17
          - Slices: macOS arm64 / iOS arm64 / iOS simulator arm64
          - Architecture support: Apple Silicon only

          This is a mutable development prerelease. Verify SHA256SUMS before use.
          EOF
          if gh release view main-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit main-latest \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --latest=false \
              --notes-file release-notes.md
          else
            gh release create main-latest \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --latest=false \
              --target "$COMMIT_SHA" \
              --title "FacetraCore main" \
              --notes-file release-notes.md
          fi
          gh release upload main-latest \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            FacetraPipeline.xcframework.zip \
            FacetraCoreSupport.zip \
            FacetraCore-main.json \
            SHA256SUMS
