name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: renderers/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.90.0 fmt --all --check
      - name: Clippy
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Contract and CLI tests
        run: cargo +1.90.0 test --locked -p facetra-contract -p facetra-render
      - name: Core tests
        run: cargo +1.90.0 test --release --locked -p facetra-pipeline -j 4
      - name: Install Playwright
        run: |
          npm ci --prefix renderers --no-audit --no-fund
          ./renderers/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser rendering smoke test
        env:
          FACETRA_TEST_RENDER: "1"
        run: cargo +1.90.0 test --locked -p facetra-render renders_a_png_when_explicitly_enabled -- --nocapture

